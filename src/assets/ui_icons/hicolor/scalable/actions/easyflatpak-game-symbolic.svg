<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Controller body: y=3–13 (10px), centred -->
  <rect fill="none" stroke="currentColor" stroke-width="1.5" x="1" y="3" width="14" height="10" rx="4"/>
  <!-- D-pad cross -->
  <line stroke="currentColor" stroke-width="1.5" stroke-linecap="round" x1="4.5" y1="8" x2="7.5" y2="8"/>
  <line stroke="currentColor" stroke-width="1.5" stroke-linecap="round" x1="6" y1="6" x2="6" y2="10"/>
  <!-- Action buttons -->
  <circle fill="currentColor" cx="10.5" cy="6.5" r="1.2"/>
  <circle fill="currentColor" cx="12.5" cy="9.5" r="1.2"/>
</svg>
